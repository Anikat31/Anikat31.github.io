<!doctype html>
<html lang="{{ site.lang | default: 'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% if page.doc_title %}{{ page.doc_title }}{% else %}{{ page.title }} · {{ site.title }}{% endif %}</title>
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#f3f3f3" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1c1c" media="(prefers-color-scheme: dark)">
  <meta name="description" content="{{ page.description | default: site.description | escape }}">
  <link rel="canonical" href="{{ page.url | absolute_url }}">
  <meta property="og:type" content="website">
  <meta property="og:site_name" content="{{ site.title | escape }}">
  <meta property="og:title" content="{% if page.doc_title %}{{ page.doc_title | escape }}{% else %}{{ page.title | escape }} · {{ site.title | escape }}{% endif %}">
  <meta property="og:description" content="{{ page.description | default: site.description | escape }}">
  <meta property="og:url" content="{{ page.url | absolute_url }}">
  <meta property="og:image" content="{{ page.image | default: '/assets/og-image.jpg' | absolute_url }}">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta name="twitter:card" content="summary_large_image">
  <link rel="stylesheet" href="{{ '/assets/css/site.css' | relative_url }}">
  <script>
    (function () {
      var root = document.documentElement, mq = window.matchMedia('(prefers-color-scheme: dark)');
      function saved() { try { return localStorage.getItem('theme'); } catch (e) { return null; } }
      function apply(t) {
        root.setAttribute('data-theme', t);
        var src = document.querySelectorAll('.visitors source');
        for (var i = 0; i < src.length; i++) src[i].media = t === 'dark' ? 'all' : 'not all';
      }
      apply(saved() || (mq.matches ? 'dark' : 'light'));
      document.addEventListener('DOMContentLoaded', function () {
        apply(root.getAttribute('data-theme'));
        var b = document.querySelector('.theme-toggle');
        if (b) b.addEventListener('click', function () {
          var t = root.getAttribute('data-theme') === 'dark' ? 'light' : 'dark';
          apply(t);
          try { localStorage.setItem('theme', t); } catch (e) {}
        });
      });
      (mq.addEventListener ? mq.addEventListener.bind(mq, 'change') : mq.addListener.bind(mq))(function (e) {
        if (!saved()) apply(e.matches ? 'dark' : 'light');
      });
    })();
  </script>
  <link rel="icon" href="{{ '/favicon.ico' | relative_url }}">
</head>
<body>
  <a class="skip" href="#main">Skip to content</a>
  {% include nav.html %}
  <main id="main">
{{ content }}
  </main>
  {% include footer.html %}
</body>
</html>
