<dialog class="lightbox" id="lightbox" aria-label="Enlarged photo">
  <button type="button" aria-label="Close">×</button>
  <img alt="">
  <p></p>
</dialog>

<script>
  // Click a photo to see it large; without scripting the links open the full image.
  (function () {
    var box = document.getElementById('lightbox');
    if (!box || typeof box.showModal !== 'function') return;
    var img = box.querySelector('img');
    var caption = box.querySelector('p');
    document.querySelectorAll('.gallery a[data-full]').forEach(function (link) {
      link.addEventListener('click', function (e) {
        e.preventDefault();
        var thumb = link.querySelector('img');
        img.src = link.getAttribute('href');
        img.alt = thumb.alt;
        caption.textContent = link.parentNode.querySelector('figcaption').textContent;
        box.showModal();
      });
    });
    box.addEventListener('click', function (e) {
      if (e.target === box || e.target.tagName === 'BUTTON') box.close();
    });
    box.addEventListener('close', function () { img.removeAttribute('src'); });
  })();
</script>
